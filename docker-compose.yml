# Deploy through the root elestio.yml template, which generates the credentials.
# Proxy: HTTPS 443 -> HTTP 172.17.0.1:3000, path /.
services:
  postgres:
    image: ghcr.io/flow-steward/flow-steward-postgres@sha256:061986a939e90f04922ddbcbddee7efd61b749634a28180554ff830244e27195
    restart: unless-stopped
    environment:
      POSTGRES_DB: flow_steward
      POSTGRES_USER: flow_steward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flow_steward -d flow_steward"]
      interval: 5s
      timeout: 5s
      retries: 60
  rabbitmq:
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    hostname: rabbitmq
    restart: unless-stopped
    # Compact's compose-local transport allows plaintext AMQP only to rabbitmq-fs:5672
    # on this Compose network. Never publish the broker port.
    networks:
      default:
        aliases:
          - rabbitmq-fs
    environment:
      RABBITMQ_DEFAULT_USER: flow_steward
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 5s
      retries: 60
  compact:
    image: ghcr.io/flow-steward/flow-steward-compact@sha256:49d4496a998274b7924b0e6179d6c01708bdbb58ccbfde2a62b083df306f7f52
    restart: unless-stopped
    stop_grace_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "172.17.0.1:3000:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: production
      FS_STACK_ENVIRONMENT: production
      FS_WORKER_PROCESSES: "2"
      APP_WORKERS: "1"
      ARTIFACT_STORAGE_BACKEND: local_fs
      FS_COMPACT_WAIT_FOR_DEPENDENCIES: "1"
      FS_COMPACT_STARTUP_TIMEOUT_SECONDS: "600"
      POSTGRES_DB: flow_steward
      POSTGRES_USER: flow_steward
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: flow_steward
      RABBITMQ_HOST: rabbitmq-fs
      FS_RABBITMQ_TRANSPORT_MODE: compose-local
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      FS_PUBLIC_BASE_URL: ${FS_PUBLIC_BASE_URL}
      FS_AUTH_TRUSTED_ORIGINS: ${FS_PUBLIC_BASE_URL}
    volumes:
      - compact-data:/data
volumes:
  postgres-data:
  rabbitmq-data:
  compact-data:
